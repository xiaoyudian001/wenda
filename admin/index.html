<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>问搭 · 审核后台</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo">问</span>
    <div>
      <div class="brand-name">问搭 · 审核后台</div>
      <div class="brand-sub">内容安全与运营看板</div>
    </div>
  </div>
  <div class="topbar-right">
    <span class="conn" id="conn">检测中…</span>
    <button class="btn btn-mini" id="refreshBtn">刷新</button>
  </div>
</header>

<main class="wrap">
  <!-- 数据看板 -->
  <section class="stats">
    <div class="stat-card">
      <div class="stat-num" id="statQ">—</div>
      <div class="stat-label">问题总数</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="statA">—</div>
      <div class="stat-label">回答总数</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="statU">—</div>
      <div class="stat-label">用户总数</div>
    </div>
    <div class="stat-card warn">
      <div class="stat-num" id="statP">—</div>
      <div class="stat-label">待回答</div>
    </div>
  </section>

  <!-- 筛选 -->
  <section class="toolbar">
    <div class="tabs">
      <button class="tab active" data-status="">全部</button>
      <button class="tab" data-status="pending">待回答</button>
      <button class="tab" data-status="answered">已有回答</button>
      <button class="tab" data-status="adopted">已采纳</button>
      <button class="tab" data-status="hidden">已隐藏</button>
    </div>
    <input class="search" id="search" placeholder="搜索标题关键词…">
  </section>

  <!-- 列表 -->
  <section class="panel">
    <table class="table">
      <thead>
        <tr>
          <th style="width:70px">分类</th>
          <th>标题</th>
          <th style="width:90px">回答</th>
          <th style="width:90px">票数</th>
          <th style="width:110px">状态</th>
          <th style="width:150px">操作</th>
        </tr>
      </thead>
      <tbody id="rows">
        <tr><td colspan="6" class="empty">加载中…</td></tr>
      </tbody>
    </table>
    <div class="pager">
      <button class="btn btn-mini" id="prevBtn">上一页</button>
      <span id="pageInfo">1 / 1</span>
      <button class="btn btn-mini" id="nextBtn">下一页</button>
    </div>
  </section>
</main>

<script src="admin.js"></script>
</body>
</html>
