<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>问搭 · 审核后台</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo">问</span>
    <div>
      <div class="brand-name">问搭 · 审核后台</div>
      <div class="brand-sub">内容安全与运营看板</div>
    </div>
  </div>
  <div class="topbar-right">
    <span class="conn" id="conn">检测中…</span>
    <button class="btn btn-mini" id="refreshBtn">刷新</button>
  </div>
</header>

<main class="wrap">
  <!-- 数据看板 -->
  <section class="stats">
    <div class="stat-card">
      <div class="stat-num" id="statQ">—</div>
      <div class="stat-label">问题总数</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="statA">—</div>
      <div class="stat-label">回答总数</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="statU">—</div>
      <div class="stat-label">用户总数</div>
    </div>
    <div class="stat-card warn">
      <div class="stat-num" id="statP">—</div>
      <div class="stat-label">待回答</div>
    </div>
    <div class="stat-card danger">
      <div class="stat-num" id="statR">—</div>
      <div class="stat-label">待处理举报</div>
    </div>
  </section>

  <!-- 主视图切换 -->
  <div class="view-tabs">
    <button class="view-tab active" data-view="questions">内容管理</button>
    <button class="view-tab" data-view="reports">举报处理 <span class="badge" id="reportBadge" hidden>0</span></button>
  </div>

  <!-- 内容管理视图 -->
  <div class="view" id="view-questions">
  <!-- 筛选 -->
  <section class="toolbar">
    <div class="tabs">
      <button class="tab active" data-status="">全部</button>
      <button class="tab" data-status="pending">待回答</button>
      <button class="tab" data-status="answered">已有回答</button>
      <button class="tab" data-status="adopted">已采纳</button>
      <button class="tab" data-status="hidden">已隐藏</button>
    </div>
    <input class="search" id="search" placeholder="搜索标题关键词…">
  </section>

  <!-- 列表 -->
  <section class="panel">
    <table class="table">
      <thead>
        <tr>
          <th style="width:70px">分类</th>
          <th>标题</th>
          <th style="width:90px">回答</th>
          <th style="width:90px">票数</th>
          <th style="width:110px">状态</th>
          <th style="width:150px">操作</th>
        </tr>
      </thead>
      <tbody id="rows">
        <tr><td colspan="6" class="empty">加载中…</td></tr>
      </tbody>
    </table>
    <div class="pager">
      <button class="btn btn-mini" id="prevBtn">上一页</button>
      <span id="pageInfo">1 / 1</span>
      <button class="btn btn-mini" id="nextBtn">下一页</button>
    </div>
  </section>
  </div>

  <!-- 举报处理视图 -->
  <div class="view" id="view-reports" hidden>
    <section class="toolbar">
      <div class="tabs">
        <button class="rtab active" data-rstatus="pending">待处理</button>
        <button class="rtab" data-rstatus="handled">已处理</button>
        <button class="rtab" data-rstatus="dismissed">已驳回</button>
      </div>
    </section>

    <section class="panel">
      <table class="table">
        <thead>
          <tr>
            <th style="width:80px">类型</th>
            <th>被举报内容</th>
            <th style="width:130px">理由</th>
            <th style="width:120px">时间</th>
            <th style="width:180px">操作</th>
          </tr>
        </thead>
        <tbody id="reportRows">
          <tr><td colspan="5" class="empty">加载中…</td></tr>
        </tbody>
      </table>
      <div class="pager">
        <button class="btn btn-mini" id="rPrevBtn">上一页</button>
        <span id="rPageInfo">1 / 1</span>
        <button class="btn btn-mini" id="rNextBtn">下一页</button>
      </div>
    </section>
  </div>
</main>

<script src="admin.js"></script>
</body>
</html>
